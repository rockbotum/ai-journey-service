name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test with the race detector
        run: go test -race -count=1 ./...

      - name: Coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tee coverage.txt
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $NF); print $NF }')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t + 0 < 70) { printf "::error::coverage %.1f%% is below 70%%\n", t; exit 1 } }'

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.txt
            coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the working tree and history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert the example and ignore files carry no real value
        run: |
          if [ -f .env ]; then
            echo "::error::.env must never be committed"
            exit 1
          fi
          # Anchored at the end of the name so a non-secret such as
          # AI_MAX_OUTPUT_TOKENS is not mistaken for a credential. The name must
          # be exactly a secret noun; AUTH_CREDENTIALS is listed explicitly
          # because it holds keys without saying so in its name.
          if grep -E '^[A-Z_]*(KEY|SECRET|TOKEN|PASSWORD|CREDENTIALS)=.+' .env.example; then
            echo "::error::.env.example must not assign a value to a secret"
            exit 1
          fi
          echo "no committed secrets"
